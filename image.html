<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<meta http-equiv="Cache-Control" content="no-store">
<title>&#8203;</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body.vide { background: #fff; }
  form { min-height: 100%; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         padding: 1.5rem; box-sizing: border-box; margin: 0; }
  input { width: min(86vw, 22rem); font: inherit; font-size: 1.3rem; text-align: center; padding: .9rem 1rem;
          border: 2px solid #c9ccd6; border-radius: .9rem; outline: none; background: #fff; color: #1b1b1f; box-sizing: border-box; }
  input:focus { border-color: #1b1b1f; }
  body.plein { background: #000; overflow: hidden; }
  .plein .cadre { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  .plein img { width: 100%; height: 100%; object-fit: contain; pointer-events: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
  .plein, .plein * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body class="vide">
<script src="config.js"></script>
<script src="commun.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Commun, CFG = window.CIRCUIT_CONFIG || {};
  var hashValide = '';   // fragment reconnu, gardé en mémoire uniquement (jamais stocké)
  var etape = 'vide';    // 'vide' | 'champ' | 'image'
  var NOM = /^[A-Za-z0-9][A-Za-z0-9._-]*\.(jpe?g|png|webp|gif|avif)$/i;

  function bloquer(e) { e.preventDefault(); }
  ['contextmenu', 'dragstart', 'selectstart'].forEach(function (t) {
    document.addEventListener(t, function (e) { if (etape === 'image') bloquer(e); });
  });

  function vide() {
    etape = 'vide';
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
    C.vider();
  }

  // Retour depuis le bfcache : revérifier le passage par le fragment.
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    if (etape === 'champ' && hashValide && location.hash === hashValide) champ();
    else vide();
  });
  // Nouveau scan dans le même onglet (seul le fragment change) : repartir de zéro.
  window.addEventListener('hashchange', function () { if (location.hash) location.reload(); });
  window.addEventListener('pagehide', function () {
    if (etape === 'image') vide();
    else if (etape === 'champ') { var i = document.querySelector('input'); if (i) i.value = ''; }
  });

  var k = C.lireFragment();
  if (!k || !CFG.fragmentImage) return;
  var hashLu = location.hash;
  C.sha256hex(k).then(function (h) {
    k = null;
    if (h !== CFG.fragmentImage) return;
    hashValide = hashLu;
    champ();
  });

  function champ() {
    etape = 'champ';
    document.title = '\u200b';
    document.body.className = '';
    document.body.innerHTML =
      '<form autocomplete="off" novalidate><input type="text" name="m" aria-label="Mot" ' +
      'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" autofocus></form>';
    var form = document.querySelector('form'), input = form.querySelector('input');
    try { input.focus(); } catch (e) {}
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var maintenant = new Date();
      var ok = C.verifier(input.value, maintenant);
      input.value = '';
      // Dans les deux cas, le fragment est effacé : un nouvel essai demande un nouveau scan.
      C.effacerFragment();
      hashValide = '';
      if (!ok) { vide(); return; }
      etape = 'image';
      var de = document.documentElement;
      if (de.requestFullscreen) de.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
      montrerImage(maintenant);
    });
  }

  function montrerImage(instant) {
    var d = C.creneau(instant), index = C.indexJour(instant);
    document.body.innerHTML = '';
    document.body.className = 'plein';
    fetch('images.json?d=' + d, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (liste) {
        if (etape !== 'image') return;
        var pool = (Array.isArray(liste) ? liste : []).map(function (x) {
          return typeof x === 'string' ? x : (x && x.fichier) || '';
        }).filter(function (n) { return NOM.test(n); });
        if (!pool.length) { vide(); return; }
        var nom = pool[C.mod(index, pool.length)];
        var img = new Image();
        img.alt = '';
        img.draggable = false;
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.onerror = vide;
        img.onload = function () {
          if (etape !== 'image') return;
          var cadre = document.createElement('div');
          cadre.className = 'cadre';
          cadre.appendChild(img);
          document.body.appendChild(cadre);
        };
        img.src = 'images/' + encodeURIComponent(nom) + '?d=' + d;
      })
      .catch(vide);
  }
})();
</script>
</body>
</html>
