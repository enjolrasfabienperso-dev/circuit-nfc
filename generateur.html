<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<meta http-equiv="Cache-Control" content="no-store">
<title>&#8203;</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1b1b1f;
         -webkit-tap-highlight-color: transparent; }
  body.vide { background: #fff; }
  .scene { min-height: 100%; min-height: 100dvh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 2.2rem; padding: 1.5rem; box-sizing: border-box;
           background: radial-gradient(circle at 50% 30%, #fff 0%, #f1f2f6 100%); }
  .ecran { width: min(88vw, 26rem); min-height: 6.5rem; display: flex; align-items: center; justify-content: center;
           border-radius: 1.2rem; background: #15161c; color: #f5f5f7; box-shadow: inset 0 0 0 3px #2b2d38, 0 10px 30px rgba(0,0,0,.15);
           font-size: clamp(1.4rem, 7vw, 2.2rem); font-weight: 700; text-align: center; padding: .8rem 1rem; box-sizing: border-box;
           letter-spacing: .02em; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .ecran span { display: inline-block; }
  .ecran.roule span { animation: defile .09s linear infinite; filter: blur(.6px); opacity: .85; }
  .ecran.fini span { animation: pose .45s cubic-bezier(.2,1.6,.4,1) both; color: #ffd84d; }
  @keyframes defile { from { transform: translateY(-35%); } to { transform: translateY(35%); } }
  @keyframes pose { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  button { appearance: none; border: 0; border-radius: 999px; padding: 1.05rem 2.8rem; font: inherit;
           font-size: 1.25rem; font-weight: 700; color: #fff; background: #c62828; box-shadow: 0 6px 18px rgba(198,40,40,.35);
           cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.97); }
  button[hidden] { display: none; }
</style>
</head>
<body class="vide">
<script src="config.js"></script>
<script src="commun.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Commun, CFG = window.CIRCUIT_CONFIG || {};
  // 1. Lire le fragment puis le retirer tout de suite (barre d'adresse + historique).
  var k = C.lireFragment();
  C.effacerFragment();
  var actif = false;

  // Retour depuis le bfcache, rechargement, favori : page vide.
  window.addEventListener('pageshow', function (e) { if (e.persisted) { actif = false; C.vider(); } });
  // Nouveau scan dans le même onglet (seul le fragment change) : repartir de zéro.
  window.addEventListener('hashchange', function () { if (location.hash) location.reload(); });
  window.addEventListener('pagehide', function () { actif = false; C.vider(); });

  if (!k || !CFG.fragmentGenerateur) return;
  C.sha256hex(k).then(function (h) {
    k = null;
    if (h !== CFG.fragmentGenerateur) return;
    actif = true;
    afficher();
  });

  function afficher() {
    document.title = 'Générateur';
    document.body.className = '';
    document.body.innerHTML =
      '<main class="scene"><div class="ecran" aria-live="polite"><span>?</span></div>' +
      '<button type="button">Générer</button></main>';
    var ecran = document.querySelector('.ecran'), span = ecran.firstChild, btn = document.querySelector('button');
    btn.addEventListener('click', function () {
      if (!actif) return;
      btn.hidden = true;
      ecran.className = 'ecran roule';
      var delai = 45, total = 0;
      (function tick() {
        if (!actif) return;
        span.textContent = C.auHasard();
        total += delai;
        delai = Math.round(delai * 1.12);
        if (total < 1700) { setTimeout(tick, delai); return; }
        ecran.className = 'ecran';
        void ecran.offsetWidth;
        span.textContent = C.motDuJour(new Date());
        ecran.className = 'ecran fini';
      })();
    });
  }
})();
</script>
</body>
</html>
